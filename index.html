<!doctype html><html lang="sl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Zvočni tloris</title><style>
*{box-sizing:border-box}body{margin:0;background:#f7f7f7;font-family:system-ui,sans-serif;min-height:100vh;display:grid;place-items:center}.wrap{width:min(98vw,1000px);position:relative}svg{display:block;width:100%;height:auto}polygon{fill:transparent;stroke:transparent;cursor:pointer;transition:fill .15s}polygon:hover,polygon:focus-visible{fill:#facc1545;stroke:#eab308;stroke-width:2;outline:none}polygon.active{fill:#22c55e38;stroke:#15803d;stroke-width:3}.notice{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);background:#182b28;color:white;padding:10px 18px;border-radius:99px;font-size:14px;max-width:95vw;text-align:center;display:none}.notice.show{display:block}
</style></head><body><main class="wrap"><svg viewBox="0 0 634 377" role="group" aria-label="Klikljiv tloris"><image href="tloris.jpg" width="634" height="377" /><polygon id="soba-s-cevlji" points="51,5 198,23 174,125 42,111" data-name="Soba s čevlji" tabindex="0" role="button" aria-label="Predvajaj: Soba s čevlji"><title>Soba s čevlji</title></polygon><polygon id="tovarna-peko" points="198,25 314,39 301,127 173,124" data-name="Tovarna Peko" tabindex="0" role="button" aria-label="Predvajaj: Tovarna Peko"><title>Tovarna Peko</title></polygon><polygon id="kraljestvo-obrti" points="316,39 449,53 466,130 304,128" data-name="Kraljestvo obrti" tabindex="0" role="button" aria-label="Predvajaj: Kraljestvo obrti"><title>Kraljestvo obrti</title></polygon><polygon id="nogavicarji" points="465,88 619,123 610,177 451,159" data-name="Nogavičarji" tabindex="0" role="button" aria-label="Predvajaj: Nogavičarji"><title>Nogavičarji</title></polygon><polygon id="tkalci" points="453,159 611,177 608,224 448,222" data-name="Tkalci" tabindex="0" role="button" aria-label="Predvajaj: Tkalci"><title>Tkalci</title></polygon><polygon id="modrotiskarji" points="448,224 607,225 609,288 432,361 431,241" data-name="Modrotiskarji" tabindex="0" role="button" aria-label="Predvajaj: Modrotiskarji"><title>Modrotiskarji</title></polygon><polygon id="ustvarjalnica" points="282,216 432,241 432,361 260,359" data-name="Ustvarjalnica" tabindex="0" role="button" aria-label="Predvajaj: Ustvarjalnica"><title>Ustvarjalnica</title></polygon><polygon id="usnjarji" points="147,280 263,278 258,359 144,352" data-name="Usnjarji" tabindex="0" role="button" aria-label="Predvajaj: Usnjarji"><title>Usnjarji</title></polygon><polygon id="otroski-koticek" points="147,239 200,240 200,270 147,271" data-name="Otroški kotiček" tabindex="0" role="button" aria-label="Predvajaj: Otroški kotiček"><title>Otroški kotiček</title></polygon><polygon id="sustarska-delavnica" points="35,241 144,241 143,353 34,350" data-name="Šuštarska delavnica" tabindex="0" role="button" aria-label="Predvajaj: Šuštarska delavnica"><title>Šuštarska delavnica</title></polygon><polygon id="cevljarji" points="43,114 173,125 147,239 36,240" data-name="Čevljarji" tabindex="0" role="button" aria-label="Predvajaj: Čevljarji"><title>Čevljarji</title></polygon><polygon id="otroska-soba" points="285,159 449,161 448,226 283,216" data-name="Otroška soba" tabindex="0" role="button" aria-label="Predvajaj: Otroška soba"><title>Otroška soba</title></polygon><polygon id="veza" points="174,125 302,128 285,160 283,216 269,243 261,279 201,278 201,239 147,239" data-name="Veža" tabindex="0" role="button" aria-label="Predvajaj: Veža"><title>Veža</title></polygon></svg></main><audio id="audio"></audio><div id="notice" class="notice" role="status"></div><script>
const audio=document.getElementById('audio'),notice=document.getElementById('notice');let current=null;
function message(t){notice.textContent=t;notice.classList.add('show');}
document.querySelectorAll('polygon').forEach(p=>{p.addEventListener('click',async()=>{const name=p.dataset.name; if(current===p&&!audio.paused){audio.pause();p.classList.remove('active');message('Premor: '+name);return;}document.querySelectorAll('polygon').forEach(x=>x.classList.remove('active'));current=p;p.classList.add('active');audio.src='zvoki/'+p.id+'.mp3';try{await audio.play();message('Predvajanje: '+name);}catch(e){p.classList.remove('active');message('Za sobo »'+name+'« še ni dodanega MP3-posnetka.');}});p.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();p.dispatchEvent(new Event('click'));}})});
audio.addEventListener('ended',()=>{current?.classList.remove('active');notice.classList.remove('show');});audio.addEventListener('error',()=>{current?.classList.remove('active');if(current)message('Za sobo »'+current.dataset.name+'« še ni dodanega MP3-posnetka.');});
</script></body></html>
